<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>QR Beacon — Receive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
  :root{
    --bg:#0A0D12;
    --surface:#131822;
    --surface-2:#1B222E;
    --line:#232B38;
    --cyan:#37E6C4;
    --amber:#FFB454;
    --text:#E8ECF1;
    --muted:#7C8798;
    --danger:#FF6B6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 16px 40px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.02em;
    margin:4px 0 2px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .dot-live{
    width:8px;height:8px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px var(--amber);
  }
  .dot-live.on{
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:.4;transform:scale(0.7);}
  }
  .subtitle{color:var(--muted);font-size:13px;margin-bottom:20px;text-align:center;max-width:340px;line-height:1.5;}

  .viewfinder{
    position:relative;
    width:100%;
    max-width:380px;
    aspect-ratio:1/1;
    background:#000;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  video{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .frame-overlay{
    position:absolute;inset:0;
    pointer-events:none;
  }
  .corner{
    position:absolute;
    width:28px;height:28px;
    border:3px solid var(--cyan);
    opacity:0.85;
  }
  .corner.tl{top:18px;left:18px;border-right:none;border-bottom:none;border-radius:6px 0 0 0;}
  .corner.tr{top:18px;right:18px;border-left:none;border-bottom:none;border-radius:0 6px 0 0;}
  .corner.bl{bottom:18px;left:18px;border-right:none;border-top:none;border-radius:0 0 0 6px;}
  .corner.br{bottom:18px;right:18px;border-left:none;border-top:none;border-radius:0 0 6px 0;}
  .sweep{
    position:absolute;
    left:14px;right:14px;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--cyan), transparent);
    top:18px;
    animation:sweep 2.2s linear infinite;
    box-shadow:0 0 10px var(--cyan);
  }
  @keyframes sweep{
    0%{top:18px;}
    50%{top:calc(100% - 18px);}
    100%{top:18px;}
  }
  .flash{
    position:absolute;inset:0;
    background:rgba(55,230,196,0.18);
    opacity:0;
    transition:opacity .1s ease;
  }
  .flash.on{opacity:1;}

  .status-bar{
    width:100%;max-width:380px;
    display:flex;
    justify-content:space-between;
    font-size:11.5px;
    color:var(--muted);
    margin-top:10px;
  }
  .status-bar b{color:var(--cyan);}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    width:100%;
    max-width:380px;
    margin-top:16px;
    display:none;
  }
  .card.show{display:block;}
  .card-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .filename{color:var(--amber);font-size:12px;word-break:break-all;}

  .grid-dots{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:12px;
  }
  .cdot{
    width:9px;height:9px;
    border-radius:2px;
    background:var(--surface-2);
    border:1px solid var(--line);
  }
  .cdot.have{
    background:var(--cyan);
    border-color:var(--cyan);
  }

  .progress-line{
    font-size:12px;
    color:var(--muted);
    margin-top:10px;
  }
  .progress-line b{color:var(--text);}

  button{
    font-family:'IBM Plex Mono',monospace;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text);
    border-radius:8px;
    padding:11px 14px;
    font-size:13px;
    cursor:pointer;
    width:100%;
    margin-top:14px;
  }
  button.primary{
    background:var(--cyan);
    color:#06110E;
    border-color:var(--cyan);
    font-weight:600;
  }
  button:disabled{opacity:0.35;cursor:not-allowed;}
  button.ghost{background:transparent;color:var(--muted);}

  .perm-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .perm-card .icon{font-size:30px;margin-bottom:10px;display:block;}
  .perm-card p{color:var(--muted);font-size:13px;line-height:1.6;margin:8px 0 16px;}
</style>
</head>
<body>

  <h1><span class="dot-live" id="liveDot"></span> QR Beacon</h1>
  <div class="subtitle">Point your camera at the sender's screen. It'll rebuild the file automatically as frames come in.</div>

  <div id="permCard" class="perm-card">
    <span class="icon">📷</span>
    <p>Needs camera access to read the QR stream.</p>
    <button class="primary" id="startBtn">Start scanning</button>
  </div>

  <div id="viewWrap" style="display:none; width:100%; display:flex; flex-direction:column; align-items:center;">
    <div class="viewfinder">
      <video id="video" playsinline muted></video>
      <div class="flash" id="flash"></div>
      <div class="frame-overlay">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="sweep" id="sweep"></div>
      </div>
    </div>
    <div class="status-bar">
      <span>status: <b id="statusText">searching…</b></span>
      <span id="fpsText"></span>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <div class="card" id="resultCard">
    <div class="card-title">
      <span>Incoming file</span>
      <span id="pct" style="color:var(--cyan);">0%</span>
    </div>
    <div class="filename" id="filename">—</div>
    <div class="progress-line"><b id="haveCount">0</b> / <span id="totalCount">0</span> chunks received</div>
    <div class="grid-dots" id="gridDots"></div>
    <button class="primary" id="saveBtn" disabled>Waiting for remaining chunks…</button>
    <button class="ghost" id="resetBtn">Start a new transfer</button>
  </div>

<script>
(function(){
  const startBtn = document.getElementById('startBtn');
  const permCard = document.getElementById('permCard');
  const viewWrap = document.getElementById('viewWrap');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const flash = document.getElementById('flash');
  const statusText = document.getElementById('statusText');
  const liveDot = document.getElementById('liveDot');

  const resultCard = document.getElementById('resultCard');
  const filenameEl = document.getElementById('filename');
  const haveCountEl = document.getElementById('haveCount');
  const totalCountEl = document.getElementById('totalCount');
  const pctEl = document.getElementById('pct');
  const gridDots = document.getElementById('gridDots');
  const saveBtn = document.getElementById('saveBtn');
  const resetBtn = document.getElementById('resetBtn');

  let stream = null;
  let rafId = null;
  let sessions = {}; 
  let activeId = null;
  let assembled = null; 
  let lastDecodeAt = 0;

  function base64ToUtf8(b64){
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  async function startCamera(){
    try{
      // Request an optimal 1080p feed. 4K chokes jsQR, and 480p is too blurry.
      stream = await navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: { ideal: 'environment' },
          width: { ideal: 1080 },
          height: { ideal: 1080 }
        },
        audio: false
      });
    }catch(e){
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }catch(e2){
        statusText.textContent = 'camera denied';
        alert('Camera access is needed to scan. Please allow camera permission and reload.');
        return;
      }
    }
    video.srcObject = stream;
    await video.play();
    permCard.style.display = 'none';
    viewWrap.style.display = 'flex';
    liveDot.classList.add('on');

    const track = stream.getVideoTracks()[0];
    if (track && track.getCapabilities){
      const caps = track.getCapabilities();
      const advanced = [];
      if (caps.focusMode && caps.focusMode.includes('continuous')) advanced.push({ focusMode: 'continuous' });
      if (caps.exposureMode && caps.exposureMode.includes('continuous')) advanced.push({ exposureMode: 'continuous' });
      if (advanced.length) track.applyConstraints({ advanced }).catch(()=>{});
    }

    tick();

    video.addEventListener('click', () => {
      if (track && track.getCapabilities && track.getCapabilities().focusMode){
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
      }
    });
  }

  function tick(){
    if (video.readyState === video.HAVE_ENOUGH_DATA){
      const w = video.videoWidth;
      const h = video.videoHeight;
      if (w && h){
        // Cap the processing resolution at 1080px to maintain high FPS for the scanner
        const maxDim = Math.max(w, h);
        const scale = maxDim > 1080 ? 1080 / maxDim : 1;
        
        canvas.width = w * scale;
        canvas.height = h * scale;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        // Removed boostContrast - raw pixels are better for jsQR's internal binarization
        // dontInvert saves CPU since screens don't output inverted colors
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
        
        if (code && code.data){
          handleDecoded(code.data);
        }
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function flashOnce(){
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 120);
  }

  function handleDecoded(str){
    if (!str.startsWith('QRF1:')) return;
    const parts = str.split(':');
    if (parts.length !== 6) return;
    const [, id, iStr, tStr, fnb64, data] = parts;
    const i = parseInt(iStr, 10);
    const t = parseInt(tStr, 10);
    if (isNaN(i) || isNaN(t)) return;

    flashOnce();
    const now = Date.now();
    if (now - lastDecodeAt > 60 && navigator.vibrate) navigator.vibrate(15);
    lastDecodeAt = now;

    if (!sessions[id]){
      let fname = 'received-file.txt';
      try{ fname = base64ToUtf8(fnb64); }catch(e){}
      sessions[id] = { total: t, filename: fname, chunks: new Map() };
    }
    const s = sessions[id];
    if (!s.chunks.has(i)) s.chunks.set(i, data);
    activeId = id;
    renderProgress();

    if (s.chunks.size === s.total){
      finishTransfer(id);
    }
  }

  function renderProgress(){
    if (!activeId || !sessions[activeId]) return;
    const s = sessions[activeId];
    resultCard.classList.add('show');
    filenameEl.textContent = s.filename;
    haveCountEl.textContent = s.chunks.size;
    totalCountEl.textContent = s.total;
    const pct = Math.round((s.chunks.size / s.total) * 100);
    pctEl.textContent = pct + '%';
    statusText.textContent = s.chunks.size === s.total ? 'complete' : ('reading ' + pct + '%');

    gridDots.innerHTML = '';
    for (let i=0;i<s.total;i++){
      const d = document.createElement('div');
      d.className = 'cdot' + (s.chunks.has(i) ? ' have' : '');
      gridDots.appendChild(d);
    }
  }

  function finishTransfer(id){
    const s = sessions[id];
    let b64 = '';
    for (let i=0;i<s.total;i++) b64 += s.chunks.get(i);
    let content = '';
    try{
      content = base64ToUtf8(b64);
    }catch(e){
      statusText.textContent = 'decode error — retry';
      return;
    }
    assembled = { filename: s.filename, content };
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save "' + s.filename + '" to device';
    statusText.textContent = 'complete';
  }

  async function saveFile(){
    if (!assembled) return;
    const blob = new Blob([assembled.content], { type: 'text/plain' });
    const file = new File([blob], assembled.filename, { type: 'text/html' });

    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({ files: [file], title: assembled.filename });
        return;
      }catch(e){ /* fall through to download */ }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = assembled.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function resetAll(){
    sessions = {};
    activeId = null;
    assembled = null;
    resultCard.classList.remove('show');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Waiting for remaining chunks…';
    statusText.textContent = 'searching…';
  }

  startBtn.addEventListener('click', startCamera);
  saveBtn.addEventListener('click', saveFile);
  resetBtn.addEventListener('click', resetAll);

  window.addEventListener('beforeunload', () => {
    if (rafId) cancelAnimationFrame(rafId);
    if (stream) stream.getTracks().forEach(t => t.stop());
  });
})();
</script>
</body>
</html>
